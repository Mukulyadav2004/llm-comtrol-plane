<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">LLM Control Plane architecture</title>
  <desc id="desc">Broker configuration flows through the Control Plane to the LLM Gateway. Client requests pass through routing, guardrails, and rate limits to model providers. Agent and MCP gateways connect models to tools.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1222"/><stop offset="1" stop-color="#172746"/></linearGradient>
    <linearGradient id="blue" x2="1" y2="1"><stop stop-color="#416bd5"/><stop offset="1" stop-color="#243f86"/></linearGradient>
    <linearGradient id="violet" x2="1" y2="1"><stop stop-color="#7454c9"/><stop offset="1" stop-color="#473780"/></linearGradient>
    <linearGradient id="teal" x2="1" y2="1"><stop stop-color="#167e78"/><stop offset="1" stop-color="#145b63"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#98add6"/></marker>
    <style>text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#eef3ff}.muted{fill:#b0bfdf}.tiny{font-size:14px}.small{font-size:17px}.label{font-size:23px;font-weight:700}.heading{font-size:34px;font-weight:750}.card{stroke:#415576;stroke-width:1.5}.line{fill:none;stroke:#98add6;stroke-width:3;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="560" rx="22" fill="url(#bg)"/>
  <rect x="24" y="24" width="1152" height="512" rx="18" fill="none" stroke="#2d4163"/>
  <text x="62" y="78" class="heading">LLM Control Plane</text>
  <text x="62" y="110" class="small muted">One API for models, tools, agents, and policy</text>
  <text x="62" y="154" class="tiny muted" letter-spacing="2">CONFIGURATION</text>
  <rect class="card" x="62" y="175" width="245" height="90" rx="15" fill="url(#violet)"/>
  <text x="85" y="213" class="label">Broker</text><text x="85" y="241" class="tiny">Routes · guardrails · tools</text>
  <path class="line" d="M308 220 H380"/>
  <rect class="card" x="385" y="175" width="310" height="90" rx="15" fill="url(#violet)"/>
  <text x="408" y="213" class="label">Control Plane</text><text x="408" y="241" class="tiny">Render + distribute config</text>
  <path class="line" d="M696 220 H768"/>
  <rect class="card" x="773" y="175" width="365" height="90" rx="15" fill="#233658"/>
  <text x="796" y="213" class="label">Live configuration</text><text x="796" y="241" class="tiny muted">Pulled by the gateways</text>
  <text x="62" y="324" class="tiny muted" letter-spacing="2">REQUEST FLOW</text>
  <rect class="card" x="62" y="346" width="171" height="112" rx="15" fill="#233658"/>
  <text x="85" y="392" class="label">Client</text><text x="85" y="422" class="tiny muted">OpenAI SDK</text>
  <path class="line" d="M234 402 H306"/>
  <rect class="card" x="311" y="346" width="384" height="112" rx="15" fill="url(#blue)"/>
  <text x="334" y="387" class="label">LLM Gateway</text><text x="334" y="418" class="tiny">Routing → rate limits → guardrails</text><text x="334" y="440" class="tiny">Fallback · cost · latency · tracing</text>
  <path class="line" d="M696 402 H768"/>
  <rect class="card" x="773" y="346" width="365" height="112" rx="15" fill="url(#teal)"/>
  <text x="796" y="387" class="label">Model providers</text><text x="796" y="418" class="tiny">Ollama · OpenAI-compatible APIs</text><text x="796" y="440" class="tiny muted">One chat-completions interface</text>
  <text x="62" y="506" class="small muted">Agent Gateway → MCP Gateway → tool servers</text>
  <text x="773" y="506" class="small muted">Dashboard → routes, usage, playground</text>
</svg>
